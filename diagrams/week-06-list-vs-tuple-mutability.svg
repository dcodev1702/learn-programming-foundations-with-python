<text x="700" y="480" fill="#a5f3fc" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">Each transaction is (description, amount, category) — always three</text>
<text x="700" y="496" fill="#a5f3fc" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">fields in the same order. A tuple documents that shape.</text>
<rect x="58" y="580" width="1104" height="54" rx="8" fill="#2b1c05" stroke="#f59e0b" stroke-width="1" opacity="0.85"/>
<rect x="58" y="580" width="4" height="54" rx="2" fill="#f59e0b"/>
<text x="74" y="600" fill="#fcd34d" font-size="10" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.6" xml:space="preserve">THE PAYOFF COMES IN WEEK 8</text>
<text x="74" y="618" fill="#fde68a" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">Because a list is mutable, passing it into a function lets that function change your original data. Because a tuple is not, it cannot be changed by accident.</text>
