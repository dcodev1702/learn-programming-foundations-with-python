<text x="212" y="410" fill="#f8fafc" font-size="15" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" xml:space="preserve">case "2":</text>
<text x="362" y="410" fill="#bbf7d0" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">Add expense</text>
<text x="1008" y="410" fill="#86efac" font-size="11.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="end" xml:space="preserve">MATCH</text>
<line x1="230" y1="436" x2="230" y2="452" stroke="#334155" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect x="190" y="454" width="840" height="66" rx="10" fill="#101827" stroke="#64748b" stroke-width="1.4" opacity="0.75"/>
<text x="212" y="494" fill="#94a3b8" font-size="15" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" xml:space="preserve">case "3":</text>
<text x="362" y="494" fill="#94a3b8" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">View balance</text>
<text x="1008" y="494" fill="#94a3b8" font-size="11.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="end" xml:space="preserve">never tested</text>
<line x1="230" y1="520" x2="230" y2="536" stroke="#334155" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect x="190" y="538" width="840" height="66" rx="10" fill="#101827" stroke="#64748b" stroke-width="1.4" opacity="0.75"/>
<text x="212" y="578" fill="#94a3b8" font-size="15" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" xml:space="preserve">case _:</text>
<text x="362" y="578" fill="#94a3b8" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">Invalid choice</text>
<text x="1008" y="578" fill="#94a3b8" font-size="11.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="end" xml:space="preserve">never tested</text>
<path d="M1038,352 L1064,352 Q1076,352 1076,364 L1076,634 Q1076,646 1064,646 L810,646" fill="none" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flowGreen)"/>
<rect x="250" y="618" width="556" height="58" rx="12" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.5" filter="url(#neon)"/>
