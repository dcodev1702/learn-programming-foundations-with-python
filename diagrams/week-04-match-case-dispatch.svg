<text x="610" y="188" fill="#a5f3fc" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">the subject — evaluated exactly once</text>
