    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>
    <linearGradient id="pageWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1728"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
