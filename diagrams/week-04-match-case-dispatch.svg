<text x="528" y="648" fill="#f8fafc" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle" xml:space="preserve">Add expense  -&gt;  amount prompt runs</text>
<rect x="58" y="286" width="116" height="70" rx="8" fill="#101827" stroke="#64748b" stroke-width="1" opacity="0.85"/>
<rect x="58" y="286" width="4" height="70" rx="2" fill="#64748b"/>
<text x="74" y="306" fill="#94a3b8" font-size="10" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.6" xml:space="preserve">ORDER</text>
<text x="74" y="324" fill="#e2e8f0" font-size="10.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">Cases run top</text>
<text x="74" y="340" fill="#e2e8f0" font-size="10.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">to bottom.</text>
<rect x="1046" y="286" width="116" height="86" rx="8" fill="#2b1c05" stroke="#f59e0b" stroke-width="1" opacity="0.85"/>
<rect x="1046" y="286" width="4" height="86" rx="2" fill="#f59e0b"/>
<text x="1062" y="306" fill="#fcd34d" font-size="10" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.6" xml:space="preserve">FALLBACK</text>
<text x="1062" y="324" fill="#fde68a" font-size="10.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">case _ catches</text>
<text x="1062" y="340" fill="#fde68a" font-size="10.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">anything</text>
<text x="1062" y="356" fill="#fde68a" font-size="10.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">unmatched.</text>
<text x="610" y="700" fill="#94a3b8" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">Forget case _ and a typo silently does nothing — the program just falls through the whole block.</text>
</svg>
