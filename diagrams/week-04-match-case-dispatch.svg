<rect x="0" y="0" width="1220" height="740" rx="0" fill="#070b14"/>
<rect x="22" y="22" width="1176" height="696" rx="16" fill="url(#pageWash)" stroke="#1e293b" stroke-width="1.4"/>
<text x="610" y="52" fill="#5b7192" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="middle" letter-spacing="3.2" xml:space="preserve">WEEK 04 · PATTERN MATCHING</text>
<text x="610" y="84" fill="#f8fafc" font-size="25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle" xml:space="preserve">How match / case Dispatches One Value</text>
<text x="610" y="108" fill="#94a3b8" font-size="12.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">The subject is evaluated once, then compared against each case top to bottom — first match wins</text>
<rect x="420" y="140" width="380" height="88" rx="12" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5" filter="url(#neon)"/>
<rect x="420" y="140" width="380" height="88" rx="12" fill="#05262f" stroke="#22d3ee" stroke-width="2"/>
