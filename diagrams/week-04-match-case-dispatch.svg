<text x="362" y="326" fill="#94a3b8" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">Add income</text>
<text x="1008" y="326" fill="#94a3b8" font-size="11.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="end" xml:space="preserve">no match</text>
<line x1="230" y1="352" x2="230" y2="368" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" marker-end="url(#flow)"/>
