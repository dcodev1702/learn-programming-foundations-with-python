<rect x="0" y="0" width="1220" height="700" rx="0" fill="#070b14"/>
<rect x="22" y="22" width="1176" height="656" rx="16" fill="url(#pageWash)" stroke="#1e293b" stroke-width="1.4"/>
<text x="610" y="52" fill="#5b7192" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="middle" letter-spacing="3.2" xml:space="preserve">WEEK 11 · FILE I/O</text>
<text x="610" y="84" fill="#f8fafc" font-size="25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle" xml:space="preserve">What with open(...) Guarantees</text>
<text x="610" y="108" fill="#94a3b8" font-size="12.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">The file is closed when the block ends — including when the block blows up halfway through</text>
<text x="62" y="140" fill="#33507c" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.5" xml:space="preserve">01</text>
<text x="92" y="140" fill="#8aa2c0" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="2.2" xml:space="preserve">WITH · THE CONTEXT MANAGER</text>
<rect x="58" y="150" width="546" height="402" rx="12" fill="#0d1526" stroke="#1b2942" stroke-width="1.2"/>
<rect x="84" y="190" width="494" height="91" rx="10" fill="#080e1c" stroke="#1f4030" stroke-width="1.2"/>
<text x="98" y="216" font-size="12" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#f472b6">with</tspan><tspan fill="#60a5fa"> open</tspan><tspan fill="#8fa3bf">(</tspan><tspan fill="#86efac">"notes.txt"</tspan><tspan fill="#8fa3bf">, </tspan><tspan fill="#86efac">"w"</tspan><tspan fill="#8fa3bf">) </tspan><tspan fill="#f472b6">as</tspan><tspan fill="#e2e8f0"> f:</tspan></text>
<text x="98" y="237" font-size="12" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#e2e8f0">    f.</tspan><tspan fill="#60a5fa">write</tspan><tspan fill="#8fa3bf">(</tspan><tspan fill="#86efac">"Hello\n"</tspan><tspan fill="#8fa3bf">)</tspan></text>
<text x="98" y="258" font-size="12" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#5b6b86"># file is already closed here</tspan></text>
<rect x="84" y="300" width="494" height="62" rx="10" fill="#05262f" stroke="#22d3ee" stroke-width="1.7"/>
<circle cx="112" cy="331" r="13" fill="#0b1220" stroke="#22d3ee" stroke-width="1.5"/>
<text x="112" y="335" fill="#67e8f9" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="middle" xml:space="preserve">1</text>
<text x="138" y="327" fill="#f8fafc" font-size="13.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" xml:space="preserve">open the file</text>
<text x="138" y="347" fill="#67e8f9" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">OS hands back a file object</text>
<line x1="112" y1="362" x2="112" y2="374" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" marker-end="url(#flow)"/>
<rect x="84" y="376" width="494" height="62" rx="10" fill="#07301c" stroke="#22c55e" stroke-width="1.7"/>
<circle cx="112" cy="407" r="13" fill="#0b1220" stroke="#22c55e" stroke-width="1.5"/>
<text x="112" y="411" fill="#86efac" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="middle" xml:space="preserve">2</text>
<text x="138" y="403" fill="#f8fafc" font-size="13.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" xml:space="preserve">run the block</text>
<text x="138" y="423" fill="#86efac" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">read or write through f</text>
<line x1="112" y1="438" x2="112" y2="450" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" marker-end="url(#flow)"/>
<rect x="84" y="452" width="494" height="62" rx="10" fill="#1d0f33" stroke="#a855f7" stroke-width="1.7"/>
<circle cx="112" cy="483" r="13" fill="#0b1220" stroke="#a855f7" stroke-width="1.5"/>
<text x="112" y="487" fill="#d8b4fe" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="middle" xml:space="preserve">3</text>
<text x="138" y="479" fill="#f8fafc" font-size="13.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" xml:space="preserve">close it — always</text>
<text x="138" y="499" fill="#d8b4fe" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">even if an exception is raised</text>
<text x="640" y="140" fill="#33507c" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.5" xml:space="preserve">02</text>
<text x="670" y="140" fill="#8aa2c0" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="2.2" xml:space="preserve">MANUAL OPEN · ONE MISSING LINE AWAY FROM A LEAK</text>
<rect x="636" y="150" width="546" height="402" rx="12" fill="#0d1526" stroke="#1b2942" stroke-width="1.2"/>
<rect x="662" y="190" width="494" height="91" rx="10" fill="#080e1c" stroke="#5b1b1b" stroke-width="1.2"/>
<text x="676" y="216" font-size="12" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#e2e8f0">f </tspan><tspan fill="#8fa3bf">= </tspan><tspan fill="#60a5fa">open</tspan><tspan fill="#8fa3bf">(</tspan><tspan fill="#86efac">"notes.txt"</tspan><tspan fill="#8fa3bf">, </tspan><tspan fill="#86efac">"w"</tspan><tspan fill="#8fa3bf">)</tspan></text>
<text x="676" y="237" font-size="12" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#e2e8f0">f.</tspan><tspan fill="#60a5fa">write</tspan><tspan fill="#8fa3bf">(</tspan><tspan fill="#8fa3bf">data)</tspan><tspan fill="#5b6b86">        # raises here?</tspan></text>
<text x="676" y="258" font-size="12" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#e2e8f0">f.</tspan><tspan fill="#60a5fa">close</tspan><tspan fill="#8fa3bf">()</tspan><tspan fill="#5b6b86">             # never reached</tspan></text>
<rect x="662" y="300" width="494" height="110" rx="12" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.5" filter="url(#neon)"/>
<rect x="662" y="300" width="494" height="110" rx="12" fill="#2e0e0e" stroke="#ef4444" stroke-width="2"/>
<text x="909" y="330" fill="#f8fafc" font-size="15" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle" xml:space="preserve">Handle stays open</text>
<text x="909" y="348" fill="#fecaca" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">Buffered bytes may never reach disk, and the OS keeps the lock until the</text>
<text x="909" y="363" fill="#fecaca" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">process exits.</text>
<rect x="662" y="426" width="494" height="70" rx="8" fill="#2b1c05" stroke="#f59e0b" stroke-width="1" opacity="0.85"/>
<rect x="662" y="426" width="4" height="70" rx="2" fill="#f59e0b"/>
<text x="678" y="446" fill="#fcd34d" font-size="10" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.6" xml:space="preserve">THE MODES YOU WILL USE</text>
<text x="678" y="464" fill="#fde68a" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">"r" read (default) · "w" write, truncates the file first · "a" append to</text>
<text x="678" y="480" fill="#fde68a" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">the end.</text>
<rect x="58" y="586" width="1124" height="54" rx="8" fill="#05262f" stroke="#22d3ee" stroke-width="1" opacity="0.85"/>
<rect x="58" y="586" width="4" height="54" rx="2" fill="#22d3ee"/>
<text x="74" y="606" fill="#67e8f9" font-size="10" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.6" xml:space="preserve">SAME IDEA, DIFFERENT RESOURCES</text>
<text x="74" y="624" fill="#a5f3fc" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">with also works for network sockets, database connections, and locks. Any object that needs deterministic cleanup can be a context manager.</text>
