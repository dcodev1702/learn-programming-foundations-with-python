<text x="1087" y="302" fill="#94a3b8" font-size="9.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" text-anchor="middle" xml:space="preserve">int object</text>
