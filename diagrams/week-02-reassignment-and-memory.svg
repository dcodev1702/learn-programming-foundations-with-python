<text x="74" y="518" fill="#d8b4fe" font-size="10" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.6" xml:space="preserve">WHY THIS MATTERS LATER</text>
<text x="74" y="536" fill="#e9d5ff" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">In Week 8 you will pass a variable into a function. Rebinding inside the function</text>
<text x="74" y="552" fill="#e9d5ff" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">does exactly this — and it never touches the caller's name.</text>
<rect x="642" y="498" width="560" height="70" rx="8" fill="#05262f" stroke="#22d3ee" stroke-width="1" opacity="0.85"/>
<rect x="642" y="498" width="4" height="70" rx="2" fill="#22d3ee"/>
<text x="658" y="518" fill="#67e8f9" font-size="10" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.6" xml:space="preserve">COUNTER IDIOM</text>
<text x="658" y="536" fill="#a5f3fc" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">score += 5 is shorthand for the same three steps. For lists, += mutates in place</text>
<text x="658" y="552" fill="#a5f3fc" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">instead, which is why Week 6 makes a point of mutability.</text>
</svg>
