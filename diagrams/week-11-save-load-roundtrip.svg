<rect x="692" y="600" width="588" height="70" rx="8" fill="#2e0e0e" stroke="#ef4444" stroke-width="1" opacity="0.85"/>
<rect x="692" y="600" width="4" height="70" rx="2" fill="#ef4444"/>
<text x="708" y="620" fill="#fca5a5" font-size="10" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.6" xml:space="preserve">HANDLE THE FIRST RUN</text>
<text x="708" y="638" fill="#fecaca" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">The very first load() has no file. Catch FileNotFoundError and start empty — do not let a</text>
