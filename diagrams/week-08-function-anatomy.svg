<text x="630" y="52" fill="#5b7192" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="middle" letter-spacing="3.2" xml:space="preserve">WEEK 08 · FUNCTIONS</text>
<text x="630" y="84" fill="#f8fafc" font-size="25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle" xml:space="preserve">Anatomy of a Function — Definition and Call</text>
<text x="630" y="108" fill="#94a3b8" font-size="12.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">Parameters are the slots in the definition; arguments are the values you drop into them at the call site</text>
<text x="62" y="136" fill="#33507c" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.5" xml:space="preserve">01</text>
<text x="92" y="136" fill="#8aa2c0" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="2.2" xml:space="preserve">THE DEFINITION</text>
<rect x="58" y="146" width="690" height="330" rx="12" fill="#0d1526" stroke="#1b2942" stroke-width="1.2"/>
<rect x="84" y="186" width="638" height="124" rx="10" fill="#080e1c" stroke="#1e2b45" stroke-width="1.2"/>
<text x="98" y="212.5" font-size="12.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#f472b6">def</tspan><tspan fill="#60a5fa"> calculate_tip</tspan><tspan fill="#8fa3bf">(</tspan><tspan fill="#e2e8f0">bill</tspan><tspan fill="#8fa3bf">, </tspan><tspan fill="#e2e8f0">tip_percent</tspan><tspan fill="#8fa3bf">=</tspan><tspan fill="#fbbf24">18</tspan><tspan fill="#8fa3bf">):</tspan></text>
<text x="98" y="236.5" font-size="12.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#86efac">    """Calculate the tip amount for a bill."""</tspan></text>
<text x="98" y="260.5" font-size="12.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#e2e8f0">    tip </tspan><tspan fill="#8fa3bf">= bill * (tip_percent / </tspan><tspan fill="#fbbf24">100</tspan><tspan fill="#8fa3bf">)</tspan></text>
<text x="98" y="284.5" font-size="12.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#f472b6">    return</tspan><tspan fill="#e2e8f0"> tip</tspan></text>
<rect x="84" y="340" width="152" height="52" rx="8" fill="#2b0f21" stroke="#ec4899" stroke-width="1.4"/>
<text x="160" y="362" fill="#f8fafc" font-size="11.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="middle" xml:space="preserve">def</text>
<text x="160" y="380" fill="#f0a8cd" font-size="10" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">starts a definition</text>
<rect x="246" y="402" width="152" height="52" rx="8" fill="#0a1e3c" stroke="#3b82f6" stroke-width="1.4"/>
<text x="322" y="424" fill="#f8fafc" font-size="11.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="middle" xml:space="preserve">calculate_tip</text>
<text x="322" y="442" fill="#93c5fd" font-size="10" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">the name you will call</text>
<rect x="408" y="340" width="152" height="52" rx="8" fill="#07301c" stroke="#22c55e" stroke-width="1.4"/>
<text x="484" y="362" fill="#f8fafc" font-size="11.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="middle" xml:space="preserve">bill</text>
<text x="484" y="380" fill="#86efac" font-size="10" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">required parameter</text>
<rect x="570" y="402" width="152" height="52" rx="8" fill="#2b1c05" stroke="#f59e0b" stroke-width="1.4"/>
<text x="646" y="424" fill="#f8fafc" font-size="11.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="middle" xml:space="preserve">tip_percent=18</text>
<text x="646" y="442" fill="#fcd34d" font-size="10" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">optional, has a default</text>
<text x="790" y="136" fill="#33507c" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.5" xml:space="preserve">02</text>
<text x="820" y="136" fill="#8aa2c0" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="2.2" xml:space="preserve">THE TWO SPECIAL LINES</text>
<rect x="786" y="146" width="416" height="330" rx="12" fill="#0d1526" stroke="#1b2942" stroke-width="1.2"/>
