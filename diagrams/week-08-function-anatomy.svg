<text x="994" y="238" fill="#a5f3fc" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">First line inside the function. Shows up in help() and</text>
<text x="994" y="253" fill="#a5f3fc" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">in your editor's tooltip.</text>
<rect x="810" y="330" width="368" height="128" rx="12" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5" filter="url(#neon)"/>
<rect x="810" y="330" width="368" height="128" rx="12" fill="#1d0f33" stroke="#a855f7" stroke-width="2"/>
<text x="994" y="360" fill="#f8fafc" font-size="15" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle" xml:space="preserve">return vs print</text>
<text x="994" y="378" fill="#e9d5ff" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">return hands a value back so the caller can use it.</text>
<text x="994" y="393" fill="#e9d5ff" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">print only draws characters on screen.</text>
<line x1="58" y1="512" x2="1202" y2="512" stroke="#1b2942" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 6"/>
<text x="58" y="504" fill="#64748b" font-size="10" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.8" xml:space="preserve">THE CALL SITE</text>
<rect x="58" y="542" width="560" height="94" rx="10" fill="#080e1c" stroke="#1e2b45" stroke-width="1.2"/>
<text x="72" y="568.5" font-size="12.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#e2e8f0">big_tip </tspan><tspan fill="#60a5fa">= calculate_tip</tspan><tspan fill="#8fa3bf">(</tspan><tspan fill="#fbbf24">50</tspan><tspan fill="#8fa3bf">, </tspan><tspan fill="#fbbf24">25</tspan><tspan fill="#8fa3bf">)</tspan></text>
<text x="72" y="590.5" font-size="12.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#60a5fa">print</tspan><tspan fill="#8fa3bf">(</tspan><tspan fill="#86efac">f"Tip: ${big_tip:.2f}"</tspan><tspan fill="#8fa3bf">)</tspan></text>
