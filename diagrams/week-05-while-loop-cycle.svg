<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 720" width="1220" height="720" role="img" aria-label="The while Loop Cycle">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 z" fill="#f43f5e"/>
    </marker>
    <marker id="flowSoft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 z" fill="#64748b"/>
    </marker>
    <marker id="flowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 z" fill="#22c55e"/>
    </marker>
    <marker id="flowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 z" fill="#f59e0b"/>
    </marker>
    <marker id="flowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 z" fill="#22d3ee"/>
    </marker>
    <marker id="flowPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 z" fill="#a855f7"/>
    </marker>
    <marker id="flowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 z" fill="#3b82f6"/>
    </marker>
    <marker id="flowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 z" fill="#ef4444"/>
    </marker>
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>
    <linearGradient id="pageWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1728"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
  </defs>
<rect x="0" y="0" width="1220" height="720" rx="0" fill="#070b14"/>
<rect x="22" y="22" width="1176" height="676" rx="16" fill="url(#pageWash)" stroke="#1e293b" stroke-width="1.4"/>
<text x="610" y="52" fill="#5b7192" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="middle" letter-spacing="3.2" xml:space="preserve">WEEK 05 · LOOPS</text>
<text x="610" y="84" fill="#f8fafc" font-size="25" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle" xml:space="preserve">The while Loop Cycle</text>
<text x="610" y="108" fill="#94a3b8" font-size="12.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">Check the condition, run the body, change something — or you will never get out</text>
<text x="62" y="132" fill="#33507c" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.5" xml:space="preserve">01</text>
<text x="92" y="132" fill="#8aa2c0" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="2.2" xml:space="preserve">THE THREE-BEAT CYCLE</text>
<rect x="58" y="142" width="700" height="434" rx="12" fill="#0d1526" stroke="#1b2942" stroke-width="1.2"/>
<rect x="250" y="196" width="300" height="72" rx="12" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5" filter="url(#neon)"/>
<rect x="250" y="196" width="300" height="72" rx="12" fill="#05262f" stroke="#22d3ee" stroke-width="2"/>
<text x="400" y="226" fill="#f8fafc" font-size="17" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle" xml:space="preserve">count = 1</text>
<text x="400" y="244" fill="#a5f3fc" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">set up before the loop</text>
<line x1="400" y1="272" x2="400" y2="300" stroke="#f43f5e" stroke-width="2.2" stroke-linecap="round" marker-end="url(#flow)"/>
<path d="M400,304 L530,364 L400,424 L270,364 Z" fill="#2b1c05" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="400" y="358" fill="#f8fafc" font-size="15" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="middle" xml:space="preserve">count &lt;= 3</text>
<text x="400" y="378" fill="#fcd34d" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">still true?</text>
<rect x="250" y="464" width="300" height="84" rx="12" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.5" filter="url(#neon)"/>
<rect x="250" y="464" width="300" height="84" rx="12" fill="#07301c" stroke="#22c55e" stroke-width="2"/>
<text x="400" y="494" fill="#f8fafc" font-size="15" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle" xml:space="preserve">run the body</text>
<text x="400" y="512" fill="#bbf7d0" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">print(count) · count += 1</text>
<line x1="400" y1="428" x2="400" y2="460" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" marker-end="url(#flowGreen)"/>
<text x="414" y="448" fill="#86efac" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" xml:space="preserve">True</text>
<path d="M250,506 L212,506 Q200,506 200,494 L200,376 Q200,364 212,364 L266,364" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flowGreen)"/>
<text x="200" y="344" fill="#86efac" font-size="10.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" text-anchor="middle" xml:space="preserve">back to the check</text>
<line x1="534" y1="364" x2="618" y2="364" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#flowSoft)"/>
<text x="560" y="352" fill="#94a3b8" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" text-anchor="middle" xml:space="preserve">False</text>
<rect x="622" y="330" width="116" height="68" rx="12" fill="none" stroke="#64748b" stroke-width="2" opacity="0.5" filter="url(#neon)"/>
<rect x="622" y="330" width="116" height="68" rx="12" fill="#101827" stroke="#64748b" stroke-width="2"/>
<text x="680" y="360" fill="#f8fafc" font-size="15" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle" xml:space="preserve">exit</text>
<text x="680" y="378" fill="#e2e8f0" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">continue after</text>
<text x="680" y="393" fill="#e2e8f0" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" xml:space="preserve">the loop</text>
<text x="800" y="132" fill="#33507c" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.5" xml:space="preserve">02</text>
<text x="830" y="132" fill="#8aa2c0" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="2.2" xml:space="preserve">IT TERMINATES</text>
<rect x="796" y="142" width="366" height="210" rx="12" fill="#0d1526" stroke="#1b2942" stroke-width="1.2"/>
<rect x="820" y="178" width="318" height="108" rx="10" fill="#080e1c" stroke="#1f4030" stroke-width="1.2"/>
<text x="834" y="203.5" font-size="11.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#e2e8f0">count </tspan><tspan fill="#8fa3bf">= </tspan><tspan fill="#fbbf24">1</tspan></text>
<text x="834" y="223.5" font-size="11.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#f472b6">while</tspan><tspan fill="#e2e8f0"> count </tspan><tspan fill="#8fa3bf">&lt;= </tspan><tspan fill="#fbbf24">3</tspan><tspan fill="#8fa3bf">:</tspan></text>
<text x="834" y="243.5" font-size="11.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#60a5fa">    print</tspan><tspan fill="#8fa3bf">(count)</tspan></text>
<text x="834" y="263.5" font-size="11.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#e2e8f0">    count </tspan><tspan fill="#8fa3bf">+= </tspan><tspan fill="#fbbf24">1</tspan><tspan fill="#5b6b86">   # the exit ticket</tspan></text>
<text x="979" y="330" fill="#86efac" font-size="12" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" text-anchor="middle" xml:space="preserve">1  2  3  then stops</text>
<text x="800" y="386" fill="#33507c" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.5" xml:space="preserve">03</text>
<text x="830" y="386" fill="#8aa2c0" font-size="11" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="2.2" xml:space="preserve">IT NEVER TERMINATES</text>
<rect x="796" y="396" width="366" height="180" rx="12" fill="#0d1526" stroke="#1b2942" stroke-width="1.2"/>
<rect x="820" y="432" width="318" height="88" rx="10" fill="#080e1c" stroke="#5b1b1b" stroke-width="1.2"/>
<text x="834" y="457.5" font-size="11.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#e2e8f0">count </tspan><tspan fill="#8fa3bf">= </tspan><tspan fill="#fbbf24">1</tspan></text>
<text x="834" y="477.5" font-size="11.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#f472b6">while</tspan><tspan fill="#e2e8f0"> count </tspan><tspan fill="#8fa3bf">&lt;= </tspan><tspan fill="#fbbf24">3</tspan><tspan fill="#8fa3bf">:</tspan></text>
<text x="834" y="497.5" font-size="11.5" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" xml:space="preserve"><tspan fill="#60a5fa">    print</tspan><tspan fill="#8fa3bf">(count)</tspan><tspan fill="#5b6b86">   # count never changes</tspan></text>
<text x="979" y="552" fill="#fca5a5" font-size="12" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" text-anchor="middle" xml:space="preserve">1 1 1 1 1 ...  press Ctrl+C</text>
<rect x="58" y="608" width="546" height="70" rx="8" fill="#1d0f33" stroke="#a855f7" stroke-width="1" opacity="0.85"/>
<rect x="58" y="608" width="4" height="70" rx="2" fill="#a855f7"/>
<text x="74" y="628" fill="#d8b4fe" font-size="10" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.6" xml:space="preserve">WHILE TRUE IS FINE — WITH A BREAK</text>
<text x="74" y="646" fill="#e9d5ff" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">A menu loop uses while True: on purpose. The exit condition moves from the header</text>
<text x="74" y="662" fill="#e9d5ff" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">into a break inside the body.</text>
<rect x="632" y="608" width="530" height="70" rx="8" fill="#2b1c05" stroke="#f59e0b" stroke-width="1" opacity="0.85"/>
<rect x="632" y="608" width="4" height="70" rx="2" fill="#f59e0b"/>
<text x="648" y="628" fill="#fcd34d" font-size="10" font-family="ui-monospace, Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace" font-weight="700" letter-spacing="1.6" xml:space="preserve">FOR OR WHILE?</text>
<text x="648" y="646" fill="#fde68a" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">Known number of items -&gt; for. Unknown, driven by user input or a condition -&gt;</text>
<text x="648" y="662" fill="#fde68a" font-size="11.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xml:space="preserve">while.</text>
</svg>
